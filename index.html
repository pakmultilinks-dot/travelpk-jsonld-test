<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Travel.pk JSON-LD test page (not part of travel.pk)</title>
</head>
<body>
<h1>Travel.pk JSON-LD blocks, ready to paste</h1>
<p>Test page only. These blocks are for the Travel.pk admin to paste into the site. They are not live on travel.pk.</p>

<!-- Block 1: Organization (TravelAgency). Already live on travel.pk; this version adds the CUIN identifier, the registered office and the Trust Centre link. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "TravelAgency",
  "@id": "https://travel.pk#organization",
  "name": "Travel.pk",
  "legalName": "TechAbout Private Limited",
  "description": "A Pakistan-based travel platform for comparing current flight and stay options, understanding fare conditions, and planning trips with clear guidance.",
  "url": "https://travel.pk",
  "logo": "https://travel.pk/logo.png",
  "foundingDate": "2017-11-16",
  "taxID": "7936522",
  "identifier": {
    "@type": "PropertyValue",
    "name": "Corporate Universal Identification No. (CUIN)",
    "value": "0113408"
  },
  "contactPoint": {
    "@type": "ContactPoint",
    "telephone": "+92-42-35692952",
    "email": "info@travel.pk",
    "contactType": "customer service",
    "availableLanguage": ["English", "Urdu"]
  },
  "openingHoursSpecification": {
    "@type": "OpeningHoursSpecification",
    "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
    "opens": "10:00",
    "closes": "19:00"
  },
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "231-B Main Boulevard, Commercial Broadway, Sector B, Phase 8, DHA",
    "addressLocality": "Lahore",
    "addressRegion": "Punjab",
    "postalCode": "53000",
    "addressCountry": "PK"
  },
  "location": {
    "@type": "Place",
    "name": "Registered office (SECP/FBR record)",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Plaza No. 7, 2nd Floor, Block-Z, Phase 3-CCA, DHA",
      "addressLocality": "Lahore Cantt, Lahore",
      "addressCountry": "PK"
    }
  },
  "subjectOf": {
    "@type": "WebPage",
    "@id": "https://travel.pk/trust/",
    "name": "Trust Centre - Identity, Credentials and Accountability",
    "url": "https://travel.pk/trust/"
  },
  "sameAs": [
    "https://www.facebook.com/TravelPKOfficial",
    "https://twitter.com/travelpk",
    "https://instagram.com/travelpk",
    "https://www.linkedin.com/company/travelpk/",
    "https://share.google/j6NXa2H9LaYKSOMG3"
  ]
}
</script>

<!-- Block 2: WebSite. Already live on travel.pk, unchanged. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": "https://travel.pk#website",
  "url": "https://travel.pk",
  "name": "Travel.pk",
  "description": "A Pakistan-based platform for comparing flights and planning destinations, visas and pilgrimage travel",
  "publisher": {
    "@type": "Organization",
    "@id": "https://travel.pk#organization"
  },
  "sameAs": [
    "https://www.facebook.com/TravelPKOfficial",
    "https://twitter.com/travelpk",
    "https://instagram.com/travelpk",
    "https://www.linkedin.com/company/travelpk/"
  ]
}
</script>

<!-- Block 3: FAQPage. Already live on travel.pk with these exact 5 questions and answers. The answers must also be visible on the homepage (task 04021) or Google will not show the FAQ rich result. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "How do I book a flight on Travel.pk?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Search your route and dates, compare the returned itineraries and fare conditions, choose an offer, check every passenger name, and continue to the available checkout. Your booking status and ticket details appear in My Trips when issuance completes."
      }
    },
    {
      "@type": "Question",
      "name": "What payment methods does Travel.pk accept?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The payment methods currently available for your booking are shown at checkout. Some routes or accounts may offer a card, wallet or manually verified local transfer; do not send money to details that are not shown in the official Travel.pk flow."
      }
    },
    {
      "@type": "Question",
      "name": "Can I cancel or change my flight?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "It depends on the airline and fare conditions. Open the booking in My Trips to see the available action or contact support. Read the quoted airline penalty and any fare difference before confirming a change or cancellation."
      }
    },
    {
      "@type": "Question",
      "name": "Does Travel.pk charge booking fees?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The checkout shows the amount due before you confirm. Review the fare, optional extras, service amount and any payment cost displayed there; if the total differs from what you expected, stop and ask support before paying."
      }
    },
    {
      "@type": "Question",
      "name": "What if my booking remains in processing?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Do not immediately submit the same booking again. Check My Trips and your email first, then contact support with the booking reference so the team can confirm whether the airline issued the order."
      }
    }
  ]
}
</script>

<!-- Block 4: BreadcrumbList for the Trust Centre page. Follows the pattern already live on About, Contact and destination pages. The homepage itself needs no BreadcrumbList (a single Home item gives no rich result). -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "https://travel.pk/"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Trust Centre",
      "item": "https://travel.pk/trust/"
    }
  ]
}
</script>

</body>
</html>
